      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/product.css" />
    <title>Printly</title>
  </head>
  <body>
    <!-- start header -->
    <header>
      <div class="container">
        <a href="index.html" class="logo">
          <img src="./assets/icon.png" alt="Printly" />
          <p>
            Printly<br />
            <span>Ideas Into Reality</span>
          </p>
        </a>

        <nav id="main-nav">
          <div class="mobile-nav-header">
            <h2>Printly</h2>
            <button id="close-nav" aria-label="Close Menu">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Shop</a></li>
            <li><a href="categories.html">Categories</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>

        <div class="menu-overlay" id="menu-overlay"></div>

        <div class="header-icons">
          <!-- Search -->
          <div class="header-action">
            <button id="search-btn" aria-label="Search">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>

            <div class="search-box" id="search-box">
              <div class="panel-header">
                <h2>Search</h2>

                <button class="close-panel" id="close-search">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>

              <div class="search-input">
                <input type="text" placeholder="Search products..." />
                <button>
                  <i class="fa-solid fa-magnifying-glass"></i>
                </button>
              </div>

              <div class="search-section">
                <h3 class="search-section-title">SEARCH RESULT</h3>

                <div class="search-result">
                  <!-- <a href="product.html" class="search-product">
                    <div class="search-product-image">
                      <img
                        src="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=800&q=80"
                        alt="3D Printed Desk Organizer"
                      />

                      <span class="product-statue">Sale</span>
                    </div>

                    <div class="search-product-info">
                      <h3>3D Printed Desk Organizer</h3>

                      <div class="product-price">
                        <span class="old-price">LE 450.00</span>
                        <span class="new-price">LE 350.00</span>
                      </div>

                      <button class="add-to-cart">
                        <i class="fa-solid fa-cart-shopping"></i>
                        Add to cart
                      </button>
                    </div>
                  </a> -->
                </div>
              </div>
            </div>
          </div>

          <!-- Wishlist -->
          <div class="header-action">
            <button id="heart-btn" aria-label="Wishlist">
              <i class="fa-regular fa-heart"></i>
              <span id="heart-count">0</span>
            </button>

            <div class="side-box love-box" id="love-box">
              <div class="panel-header">
                <h2>Wishlist</h2>

                <button class="close-panel" id="close-love">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>
              <div class="wishlist-products" id="wishlist-products"></div>

              <a href="products.html" class="panel-btn"> Explore Products </a>
            </div>
          </div>

          <!-- cart -->
          <div class="header-action">
            <button id="cart-btn" aria-label="cart">
              <i class="fa-solid fa-cart-shopping"></i>

              <span id="cart-count">0</span>
            </button>

            <div class="side-box cart-box" id="cart-box">
              <div class="panel-header">
                <h2>Your cart</h2>

                <button class="close-panel" id="close-cart">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>

              <div class="cart-products" id="cart-products"></div>

              <div class="cart-summary">
                <div class="cart-subtotal">
                  <span>Subtotal</span>
                  <strong></strong>
                </div>

                <div class="cart-shipping">
                  <span>Shipping</span>
                  <strong></strong>
                </div>

                <div class="cart-total">
                  <span>Total</span>
                  <strong></strong>
                </div>

                <a href="checkout.html" class="checkout-btn">
                  Proceed to Checkout
                </a>
              </div>
            </div>
          </div>
          <div class="header-action">
            <button id="burger-btn" class="burger-btn" aria-label="Open Menu">
              <i class="fa-solid fa-bars"></i>
            </button>
          </div>
        </div>
      </div>
    </header>
    <!-- end header -->

    <main class="product-page">
      <div class="container">
        <div class="product-details" id="product-details"></div>
      </div>
    </main>
    <script src="js/panals.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/wishlist.js"></script>
    <script type="module" src="js/product.js"></script>
    <script type="module" src="js/search.js"></script>
